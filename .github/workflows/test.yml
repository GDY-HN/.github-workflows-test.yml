        run: |
          $bytes = [Convert]::FromBase64String(($env:B64 -replace '\s',''))
          [IO.File]::WriteAllBytes("setup.bat", $bytes)
          "written bytes: $($bytes.Length)"

      - name: 2. narrow PATH to system + winget, then run
        shell: cmd
        run: |
          for /f "delims=" %%i in ('where winget 2^>nul') do set WGDIR=%%~dpi
          echo winget dir: %WGDIR%
          set "PATH=%SystemRoot%\system32;%SystemRoot%;%WGDIR%"
          echo --- resolvable tools before run ---
          where pwsh
          where git
          where rg
          where winget
          echo --- executing setup.bat ---
          setup.bat < nul
          echo EXITCODE=%errorlevel%

      - name: 3. post-run verification
        shell: pwsh
        run: |
          foreach ($x in 'pwsh','git','rg') {
            $c = Get-Command $x -ErrorAction SilentlyContinue
            "$x : " + $(if ($c) { $c.Source } else { '(not found)' })
          }
          "GitBash default path exists: $(Test-Path 'C:\Program Files\Git\bin\bash.exe')"
