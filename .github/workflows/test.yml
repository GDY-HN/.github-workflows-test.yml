          $lf = 0; $crlf = 0; $hi = 0
          for ($i = 0; $i -lt $b.Length; $i++) {
            if ($b[$i] -eq 10) { $lf++; if ($i -gt 0 -and $b[$i-1] -eq 13) { $crlf++ } }
            if ($b[$i] -gt 127) { $hi++ }
          }
          "CRLF=$crlf  bareLF=$($lf-$crlf)  nonASCII=$hi"
          $t = [IO.File]::ReadAllText("setup.bat")
          "open=$(([regex]::Matches($t,'\(')).Count)  close=$(([regex]::Matches($t,'\)')).Count)"
